name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v1.0.0"
        required: true
        default: "v1.0.0"
      draft:
        description: "Create or keep the GitHub Release as a draft"
        required: true
        type: boolean
        default: true
      distribution:
        description: "Release distribution mode"
        required: true
        type: choice
        default: "unsigned-public-beta"
        options:
          - unsigned-public-beta
          - notarized-release
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    env:
      VIEWMD_SIGN_IDENTITY: ${{ secrets.APPLE_DEVELOPER_ID_SIGNING_IDENTITY }}
      VIEWMD_NOTARY_PROFILE: viewmd-notary
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
      RELEASE_DRAFT: ${{ github.event.inputs.draft || 'false' }}
      RELEASE_DISTRIBUTION: ${{ github.event.inputs.distribution || 'unsigned-public-beta' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Import Developer ID certificate
        if: env.RELEASE_DISTRIBUTION == 'notarized-release'
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.APPLE_BUILD_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$CERTIFICATE_BASE64" || -z "$CERTIFICATE_PASSWORD" || -z "$KEYCHAIN_PASSWORD" ]]; then
            echo "Missing certificate secrets." >&2
            exit 1
          fi

          keychain="$RUNNER_TEMP/viewmd-signing.keychain-db"
          certificate="$RUNNER_TEMP/developer-id.p12"
          echo "$CERTIFICATE_BASE64" | base64 --decode > "$certificate"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security import "$certificate" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security list-keychain -d user -s "$keychain" $(security list-keychain -d user | sed s/\"//g)
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$keychain"

      - name: Configure notary credentials
        if: env.RELEASE_DISTRIBUTION == 'notarized-release'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$APPLE_ID" || -z "$APPLE_TEAM_ID" || -z "$APPLE_APP_SPECIFIC_PASSWORD" ]]; then
            echo "Missing notary secrets." >&2
            exit 1
          fi

          xcrun notarytool store-credentials "$VIEWMD_NOTARY_PROFILE" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD"

      - name: Build unsigned public beta
        if: env.RELEASE_DISTRIBUTION == 'unsigned-public-beta'
        run: ./scripts/release-build.sh --unsigned-public-beta

      - name: Build, sign, notarize, and package
        if: env.RELEASE_DISTRIBUTION == 'notarized-release'
        run: ./scripts/release-build.sh --require-release-signing --notarize

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$RELEASE_DISTRIBUTION" == "unsigned-public-beta" ]]; then
            asset="ViewMD/build/dist/ViewMD-1.0.0-mac-universal-unsigned.zip"
            checksum="ViewMD/build/dist/ViewMD-1.0.0-mac-universal-unsigned.zip.sha256"
          else
            asset="ViewMD/build/dist/ViewMD-1.0.0-mac-universal.zip"
            checksum="ViewMD/build/dist/ViewMD-1.0.0-mac-universal.zip.sha256"
          fi

          notes="docs/RELEASE_NOTES_v1.0.0.md"
          draft_flag=()

          if [[ "$RELEASE_DRAFT" == "true" ]]; then
            draft_flag=(--draft)
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$asset" "$checksum" --clobber
          else
            gh release create "$RELEASE_TAG" "$asset" "$checksum" \
              --title "ViewMD 1.0.0: Read and export AI-generated Markdown on your Mac" \
              --notes-file "$notes" \
              --target "$GITHUB_SHA" \
              "${draft_flag[@]}"
          fi
