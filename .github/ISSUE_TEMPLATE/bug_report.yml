name: Bug report
description: Report a reproducible ViewMD problem.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Please avoid attaching private Markdown files. A redacted sample or a small public test file is best.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      placeholder: "Example: Export PDF failed after opening a Markdown file with a local image."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ViewMD version or release
      placeholder: "Example: 1.0.0 public beta"
    validations:
      required: false
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "Example: macOS 15.5"
    validations:
      required: false
