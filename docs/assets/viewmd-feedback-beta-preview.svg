<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1440" viewBox="0 0 1440 1440" role="img" aria-labelledby="title desc">
  <title id="title">ViewMD public release preview</title>
  <desc id="desc">A generated preview of ViewMD showing an AI-generated Markdown research brief rendered as a polished Mac document.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef7f2"/>
      <stop offset="0.52" stop-color="#dbece5"/>
      <stop offset="1" stop-color="#d5e3f3"/>
    </linearGradient>
    <linearGradient id="window" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f5f8f6"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="28" stdDeviation="26" flood-color="#183428" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1440" height="1440" fill="url(#bg)"/>
  <circle cx="1240" cy="130" r="210" fill="#2b6cb0" opacity="0.12"/>
  <circle cx="150" cy="770" r="250" fill="#1f513e" opacity="0.12"/>

  <g filter="url(#shadow)">
    <rect x="112" y="72" width="1216" height="816" rx="18" fill="url(#window)" stroke="#c7d8cf"/>
    <rect x="112" y="72" width="1216" height="58" rx="18" fill="#eef4ef" stroke="#c7d8cf"/>
    <circle cx="150" cy="101" r="8" fill="#ef6a5b"/>
    <circle cx="176" cy="101" r="8" fill="#f4bf4f"/>
    <circle cx="202" cy="101" r="8" fill="#61c554"/>
    <text x="720" y="107" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1c3027">2026 Home Office Buying Brief.md</text>
  </g>

  <g>
    <rect x="180" y="174" width="330" height="630" rx="10" fill="#16231d"/>
    <text x="212" y="226" font-family="Menlo, SFMono-Regular, monospace" font-size="20" font-weight="700" fill="#dff2e9"># 2026 Home Office</text>
    <text x="212" y="260" font-family="Menlo, SFMono-Regular, monospace" font-size="20" font-weight="700" fill="#dff2e9">Buying Brief</text>
    <text x="212" y="318" font-family="Menlo, SFMono-Regular, monospace" font-size="15" fill="#9fd3bd">## Recommendation</text>
    <text x="212" y="354" font-family="Menlo, SFMono-Regular, monospace" font-size="15" fill="#c9ded4">Choose the Focused</text>
    <text x="212" y="380" font-family="Menlo, SFMono-Regular, monospace" font-size="15" fill="#c9ded4">Professional setup...</text>
    <text x="212" y="444" font-family="Menlo, SFMono-Regular, monospace" font-size="15" fill="#9fd3bd">| Category | Choice |</text>
    <text x="212" y="474" font-family="Menlo, SFMono-Regular, monospace" font-size="15" fill="#c9ded4">| Desk | Standing |</text>
    <text x="212" y="504" font-family="Menlo, SFMono-Regular, monospace" font-size="15" fill="#c9ded4">| Chair | Ergonomic |</text>
    <text x="212" y="572" font-family="Menlo, SFMono-Regular, monospace" font-size="15" fill="#9fd3bd">## Checklist</text>
    <text x="212" y="610" font-family="Menlo, SFMono-Regular, monospace" font-size="15" fill="#c9ded4">- [ ] Monitor height</text>
    <text x="212" y="638" font-family="Menlo, SFMono-Regular, monospace" font-size="15" fill="#c9ded4">- [ ] Chair fit</text>
  </g>

  <g>
    <rect x="560" y="156" width="700" height="680" rx="8" fill="#ffffff" stroke="#d4e0d9"/>
    <rect x="610" y="206" width="600" height="580" rx="4" fill="#fbfdfb" stroke="#e2ebe6"/>
    <text x="660" y="278" font-family="Iowan Old Style, Georgia, serif" font-size="48" font-weight="700" fill="#17201b">2026 Home Office</text>
    <text x="660" y="332" font-family="Iowan Old Style, Georgia, serif" font-size="48" font-weight="700" fill="#17201b">Buying Brief</text>
    <line x1="660" y1="372" x2="1160" y2="372" stroke="#cddbd3" stroke-width="2"/>
    <text x="660" y="430" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="21" fill="#54645c">Remote workers do not need the most expensive desk setup.</text>
    <text x="660" y="464" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="21" fill="#54645c">They need clear audio, stable video, comfortable posture,</text>
    <text x="660" y="498" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="21" fill="#54645c">and a desk surface that does not fight the work.</text>

    <rect x="660" y="548" width="500" height="58" rx="6" fill="#eaf4ef" stroke="#cddbd3"/>
    <text x="684" y="584" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f513e">Recommendation</text>
    <text x="856" y="584" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="18" fill="#17201b">Focused Professional setup</text>

    <g font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="18" fill="#17201b">
      <rect x="660" y="646" width="500" height="52" fill="#f5faf7" stroke="#cddbd3"/>
      <rect x="660" y="698" width="500" height="52" fill="#ffffff" stroke="#cddbd3"/>
      <rect x="660" y="750" width="500" height="52" fill="#f5faf7" stroke="#cddbd3"/>
      <text x="684" y="679" font-weight="700">Desk</text>
      <text x="820" y="679">48 to 60 inch standing desk</text>
      <text x="684" y="731" font-weight="700">Chair</text>
      <text x="820" y="731">Adjustable ergonomic task chair</text>
      <text x="684" y="783" font-weight="700">Display</text>
      <text x="820" y="783">27-inch 4K monitor</text>
    </g>
  </g>

  <g>
    <rect x="1040" y="790" width="230" height="54" rx="27" fill="#1f513e"/>
    <text x="1155" y="825" text-anchor="middle" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="18" font-weight="800" fill="#f7faf7">Export PDF</text>
  </g>
</svg>
